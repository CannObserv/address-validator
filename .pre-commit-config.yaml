repos:
  # Ruff runs from uv.lock, not ruff-pre-commit: one pin, which Dependabot's
  # dev-tools group moves. A second `rev:` here would drift on every dev bump,
  # and pre-ship already runs `uv run ruff` (#361). Guarded by
  # tests/ci/test_dependabot_repo.py.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        language: system
        entry: uv run --frozen ruff check --force-exclude
        args: [--fix]
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run --frozen ruff format --force-exclude
        # markdown: ruff 0.17 formats Python blocks in .md, and pre-ship checks `.` (#377)
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # -x: follow `# shellcheck source=` even when the sourced file isn't
        # among the commit's files, else SC1091 fails the hook (#322)
        args: [-x]
        files: ^(infra|tests/shell)/.*\.sh$
  - repo: local
    hooks:
      - id: libpostal-probe-test
        name: libpostal-probe sandbox tests
        language: system
        entry: bash tests/shell/libpostal-probe-test.sh
        files: '^(infra/(libpostal-probe\.sh|journal-warn\.sh)|tests/shell/libpostal-probe-test\.sh)$'
        pass_filenames: false
      - id: address-validator-liveness-test
        name: address-validator-liveness sandbox tests
        language: system
        entry: bash tests/shell/address-validator-liveness-test.sh
        files: '^(infra/(address-validator-liveness\.sh|journal-warn\.sh)|tests/shell/address-validator-liveness-test\.sh)$'
        pass_filenames: false
      - id: install-units-test
        name: install-units sandbox tests
        language: system
        entry: bash tests/shell/install-units-test.sh
        files: '^(infra/install-units\.sh|tests/shell/install-units-test\.sh)$'
        pass_filenames: false
      - id: build-tailwind-css
        name: Build Tailwind CSS
        language: system
        entry: scripts/build/pre-commit-tailwind.sh
        files: '^(src/address_validator/templates/.*\.html|src/address_validator/static/admin/css/input\.css|tailwind\.config\.js)$'
        pass_filenames: false
      - id: eslint
        name: ESLint (admin JS)
        language: system
        entry: npm run --silent lint:js
        files: '^(src/address_validator/static/admin/js/.*\.js|tests/js/.*\.js)$'
        pass_filenames: false
      - id: prettier-check
        name: Prettier check (admin JS)
        language: system
        entry: npm run --silent format:js:check
        files: '^(src/address_validator/static/admin/js/.*\.js|tests/js/.*\.js)$'
        pass_filenames: false
