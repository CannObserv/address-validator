# Memory cap for Provisioner's canonical disk GC (#326). A drop-in, never an
# edit of the installed unit, which install-disk-gc.sh checks against MANIFEST.
#
# Install: sudo mkdir -p /etc/systemd/system/cannobserv-disk-gc.service.d \
#          && sudo cp infra/cannobserv-disk-gc-memory.conf \
#               /etc/systemd/system/cannobserv-disk-gc.service.d/10-memory-cap.conf \
#          && sudo systemctl daemon-reload
#
# No swap (docs/HOST-MEMORY.md): an overrun is killed inside its own cgroup, not
# a reserved service. The cgroup holds python, `uv cache prune --force` run as
# exedev, and the docker CLI; the daemon's prune work is charged to docker.
# Measured 2026-10-30, report-only run: 2.2M cgroup peak in 0.7 s. Re-measure
# the first pruning run (`systemctl show -p MemoryPeak`) and record it there.
[Service]
MemoryAccounting=yes
MemoryHigh=384M
MemoryMax=512M
