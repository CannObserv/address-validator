# Memory reservation for the validation-cache database (GH #214).
#
# Install: sudo mkdir -p /etc/systemd/system/postgresql@16-main.service.d \
#          && sudo cp infra/postgresql-memory.conf \
#               /etc/systemd/system/postgresql@16-main.service.d/10-memory-reservation.conf \
#          && sudo systemctl daemon-reload
#
# Losing postgres is a production outage, not degradation: /api/v2/health
# returns HTTP 503 on `database: error`, where libpostal going away is only
# `libpostal: unavailable` and leaves the status ok. That asymmetry is the
# whole reason this file exists and infra/libpostal.service has no counterpart.
#
# 384M against ~281 MB measured steady state. Sized like the app's own
# reservation -- enough headroom to absorb normal growth without the floor
# becoming a number nobody revisits, and small enough that it plus the app's
# 512M fits inside system.slice's 1G parent allocation with room to spare.
# Raising this means raising infra/system-slice-memory.conf in the same change,
# or the two children start competing for a short parent allocation instead of
# each receiving its claim.
#
# No OOMScoreAdjust here. The app's -500 buys separation from an unadjusted
# process; giving postgres the same value would only restore the tie between
# them, and the useful ordering under real exhaustion is libpostal first
# (self-restarting, degrades to `unavailable`), then everything unadjusted,
# then these two.
[Service]
MemoryAccounting=yes
MemoryLow=384M
