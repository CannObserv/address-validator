# Memory cap for Provisioner's headroom sensor (#326). A drop-in, never an edit
# of the installed unit, which install-disk-gc.sh checks against MANIFEST.
#
# Install: sudo mkdir -p /etc/systemd/system/cannobserv-disk-headroom.service.d \
#          && sudo cp infra/cannobserv-disk-headroom-memory.conf \
#               /etc/systemd/system/cannobserv-disk-headroom.service.d/10-memory-cap.conf \
#          && sudo systemctl daemon-reload
#
# python, one statvfs and one HTTP check-in every 10 min. Headroom is deliberate,
# as for libpostal-probe: an OOM kill misses the check-in, and co-status pages
# "has stopped reporting".
[Service]
MemoryAccounting=yes
MemoryHigh=96M
MemoryMax=128M
