# Atomic-allocation headroom for the address-validator host (GH #214).
#
# Install: sudo cp infra/60-address-validator-memory.conf /etc/sysctl.d/ \
#          && sudo sysctl --system
#
# This VM has 7.2 GiB and no swap. The kernel default sized min_free_kbytes at
# ~11 MB, which is the reserve that GFP_ATOMIC allocations draw on -- softirq
# and network paths that cannot sleep to reclaim. When a large allocation
# (a SocratiCode install peaked at 1.2 G on a sibling host) eats the free pool
# faster than reclaim refills it, those callers fail rather than wait: the
# failure surfaces as page-allocation errors in tailscaled and ksoftirqd and a
# down network, with nothing OOM-killed. 128 MB gives reclaim room to run
# before the atomic reserve is touched -- ~1.7% of RAM, the usual sizing for a
# swapless host.
vm.min_free_kbytes = 131072
