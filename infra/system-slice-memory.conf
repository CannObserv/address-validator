# Parent memory allocation for system.slice (GH #214).
#
# Install: sudo mkdir -p /etc/systemd/system/system.slice.d \
#          && sudo cp infra/system-slice-memory.conf \
#               /etc/systemd/system/system.slice.d/10-memory-reservation.conf \
#          && sudo systemctl daemon-reload
#
# Why this file exists at all. systemd.resource-control(5): "For a protection
# to be effective, it is generally required to set a corresponding allocation
# on all ancestors, which is then distributed between children (with the
# exception of the root slice)." A cgroup's effective memory.low is bounded by
# its ancestors', so MemoryLow= on address-validator.service alone is inert
# while system.slice sits at the default 0 -- configured, reported by
# `systemctl show`, and doing nothing.
#
# This host does not soften that rule: /sys/fs/cgroup is mounted `rw,relatime`
# with no `memory_recursiveprot`, so the strict hierarchical bound applies.
# system.slice's own parent is the root slice, which the man page exempts --
# so these two levels are the whole chain.
#
# Sizing: the explicit child claims are address-validator.service 512M and
# postgresql@16-main.service 384M = 896M. The parent must cover them or the
# children compete proportionally for a short allocation instead of each
# receiving what it asked for. The remaining 128M is undistributed, which the
# man page makes a shared protection for every other child of system.slice
# (docker, containerd, journald, cron) -- deliberate: it is a floor for the
# rest of the system, not a reservation any one of them can rely on.
#
# Sessions are NOT covered by this and that is the point: user@1000.service
# lives under user-1000.slice -> user.slice, a sibling of system.slice at
# memory.low 0. Protecting system.slice is what makes reclaim prefer an agent
# session over the production service.
[Slice]
MemoryAccounting=yes
MemoryLow=1G
