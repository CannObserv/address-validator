# #241: a persistent journal, capped at 512M.
#
# The exeuntu image (Feb 2026) masked systemd-journal-flush.service, so journald
# never left /run despite the image's own Storage=persistent: the 2026-09-29
# reboot lost 51 days. The fix is `systemctl unmask`, not this file; this file
# keeps the setting tracked and caps the disk the data stores boot from.
#
# 512M agrees with the cohort drop-in gregoryfoster/skills#425 will install,
# /usr/local/lib/systemd/journald.conf.d/zz-cannobserv-journal.conf. journald
# reads every conf.d file in name order across /etc, /run and /usr/local/lib,
# so that one sorts last and wins: keep the two equal. Applies on restart of
# systemd-journald. docs/LOGGING.md "Journal retention".
[Journal]
Storage=persistent
SystemMaxUse=512M
