# #235: needrestart lists restarts, never performs them.
#
# apt's hook runs `needrestart -m u` after every dpkg run, and Ubuntu's patch
# makes that AUTOMATIC restarts when this key is unset - the stock state. A
# libc6 security update would then restart address-validator, PostgreSQL and
# the Docker daemon under libpostal mid-apply, outside a window, while
# power-map stores its address writes unstandardized. With the key set,
# needrestart prints "Disabling Ubuntu mode, explicit restart mode configured"
# and only lists. Maintainer scripts are out of its reach: postgresql-16 and
# containerd restart themselves. Shape from CannObserv/replicator#122 and
# CannObserv/watcher#331.
#
# Keep `$nrconf{ui}` unset: setting it without this key forces interactive
# mode. A parse error here makes needrestart die, which the hook swallows with
# `|| true` - restarting nothing, so it fails safe.
$nrconf{restart} = 'l';
