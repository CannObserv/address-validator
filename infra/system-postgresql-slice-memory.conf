# Intermediate slice allocation for the templated postgres unit (GH #214).
#
# Install: sudo mkdir -p /etc/systemd/system/system-postgresql.slice.d \
#          && sudo cp infra/system-postgresql-slice-memory.conf \
#               /etc/systemd/system/system-postgresql.slice.d/10-memory-reservation.conf \
#          && sudo systemctl daemon-reload
#
# systemd puts a TEMPLATED unit under an implicit per-template slice:
# postgresql@16-main.service lands in system.slice/system-postgresql.slice/,
# not directly in system.slice. That intermediate slice is auto-created with no
# resource settings, so it defaults to memory.low 0 -- and since a cgroup's
# effective memory.low is bounded by every ancestor, it clamped
# infra/postgresql-memory.conf's 384M to an effective 0.
#
# Measured after installing the unit drop-in and before this file existed:
#   /sys/fs/cgroup/system.slice/system-postgresql.slice/memory.low          0
#   .../system-postgresql.slice/postgresql@16-main.service/memory.low  402653184
#
# Same failure as the one infra/system-slice-memory.conf fixes, one level
# deeper, and it is easy to miss twice: the unit's own value reads correct, and
# the path a reviewer expects (system.slice/postgresql@16-main.service) does
# not even exist. Any templated unit added here needs its own
# system-<prefix>.slice allocation; a plain unit does not.
#
# 384M matches the child exactly -- postgresql@16-main is the only member, so
# there is nothing to share it with and no reason to reserve more than the
# child claims. Raising the child means raising this file and
# infra/system-slice-memory.conf in the same change.
[Slice]
MemoryAccounting=yes
MemoryLow=384M
