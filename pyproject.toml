[project]
name = "address-validator"
version = "0.1.0"
description = "USPS address parsing and standardization service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143,<1",
    "starlette>=1.8,<2",
    "uvicorn>=0.41,<1",
    "usaddress>=0.5.16,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.16,<3",
    "pycountry>=26.2.16,<27",
    "httpx>=0.28,<1",
    "python-ulid>=3.1,<5",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "google-cloud-quotas>=0.5,<1",
    "google-cloud-monitoring>=2.0,<3",
    "google-cloud-storage>=3.1,<4",
    "google-auth>=2.0,<3",
    "pyarrow>=26.0,<27",
    "jinja2>=3.1.6,<4",
    "google-i18n-address>=3.1.1,<4",
    "python-multipart>=0.0.32,<1",
    "python-json-logger>=4.2,<5",
    "notifier-client>=0.3.1,<1",
    "email-validator>=2.3,<3",  # FastAPI validates OpenAPI contact.email as EmailStr (#342)
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "packaging>=26.3,<27",  # tests/ci imports it directly (#361)
    "parserator>=0.6.9,<1",
    "pre-commit>=4.5.1,<5",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=7.0.0,<8",
    "pyyaml>=6.0.3,<7",  # tests/ci imports it directly (#361)
    "ruff>=0.17.2,<1",
]

[tool.uv.sources]
# Consumed as a pinned git tag, per CannObserv/notifier docs/RELEASING.md. uv does not
# enforce the floor above against a git source; the tag is the pin (#232).
notifier-client = { git = "https://github.com/CannObserv/notifier.git", subdirectory = "clients/python", tag = "v0.3.1" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "scripts", "infra"]
addopts = "--cov=src/address_validator --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: full HTTP stack tests (require app lifespan)",
    "unit: isolated unit tests",
]

[tool.coverage.run]
source = ["src/address_validator"]
omit = [
    "src/address_validator/usps_data/__init__.py",
    "src/address_validator/services/__init__.py",
    "src/address_validator/routers/__init__.py",
    "src/address_validator/middleware/__init__.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "skills-vendor"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations
    "RUF",  # ruff-native rules
    "PL",   # pylint
    "SLF",  # flake8-self (private member access)
    "PTH",  # flake8-use-pathlib
    "TCH",  # flake8-type-checking
]
ignore = [
    "ANN401",  # Dynamically typed expressions (Any) allowed where needed
    "S101",    # Use of assert (needed in tests)
    "PLR0913", # Too many arguments — acceptable in FastAPI handlers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN",     # No annotation requirements in tests
    "S",       # Security rules relaxed in tests
    "PLR2004", # Magic value comparisons are expected in assertions
    "SLF001",  # Private member access is intentional in tests
]
# Copied from the adopting-dependabot skill's assets; edited only in their ADAPT
# blocks, so their docstrings keep upstream's line length (#361).
"tests/ci/test_dependabot.py" = ["E501"]
"tests/ci/test_dependency_imports.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["address_validator"]
